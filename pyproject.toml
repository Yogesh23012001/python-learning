[project]
name = "url-shortener"
version = "0.1.0"
description = "URL shortener — Week 1 Hour 5 build"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.106.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "google-genai>=2.6.0",
    "httpx>=0.28.1",
    "openai>=2.38.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
    "purgatory>=3.0.1",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "redis>=5.0",
    "sentence-transformers>=5.5.1",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27",
]

[tool.uv]
package = true                # ← makes uv treat this as a package

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/url_shortener", "src/github_fetcher", "src/async_practice"]

# ============================================================
# Ruff — linter + formatter
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # bugbear (common bugs)
    "UP",   # pyupgrade (modern syntax)
    "N",    # pep8-naming
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = ["E501"]   # line-too-long handled by formatter

# Allow FastAPI's Depends/Query/Path/Body/etc. in argument defaults (the
# standard pattern); otherwise bugbear's B008 flags every route handler.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.format]
quote-style = "double"

# ============================================================
# Mypy — strict type checking
# ============================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

# Demo / learning scripts are intentionally loose — they explore APIs
# and don't carry production safety guarantees. Production paths still
# get full --strict treatment.
[[tool.mypy.overrides]]
module = [
    "llm.client_demo",
    "llm.error_demo",
    "llm.first_call",
    "llm.multi_turn",
    "llm.rate_limit_demo",
    "llm.streaming",
    "llm.streaming_structured",
    "llm.structured",
    "llm.token_counting",
    "api.breaker_demo",
    "api.resilience_demo",
]
ignore_errors = true

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=url_shortener --cov=github_fetcher --cov=async_practice --cov-report=term-missing"
asyncio_mode = "auto"            # ← new

