[project]
name = "url-shortener"
version = "0.1.0"
description = "URL shortener — Week 1 Hour 5 build"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic[email]>=2.13.4",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
package = true                # ← makes uv treat this as a package

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/url_shortener", "src/github_fetcher", "src/async_practice"]

# ============================================================
# Ruff — linter + formatter
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # bugbear (common bugs)
    "UP",   # pyupgrade (modern syntax)
    "N",    # pep8-naming
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = ["E501"]   # line-too-long handled by formatter

[tool.ruff.format]
quote-style = "double"

# ============================================================
# Mypy — strict type checking
# ============================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=url_shortener --cov=github_fetcher --cov=async_practice --cov-report=term-missing"
asyncio_mode = "auto"            # ← new

